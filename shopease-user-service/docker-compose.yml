# Standalone stack for this service: the API and its own MySQL database.
# Values come from .env (see .env.example), which is never copied into the image.
#
# The Authentication Service runs in its own Compose project (shopease-auth-service) and
# publishes its API on port 8001 of this machine. Service names do not resolve across separate
# Compose projects, so the user-service container reaches it through the host:
# host.docker.internal:8001.
#
# MySQL is not published to the host. To reach it from this machine (Alembic or pytest outside
# a container), add docker-compose.dev.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

name: shopease-user-service

services:
  user-mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set in .env}"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopease_user_db}
      MYSQL_USER: "${MYSQL_USER:?set in .env}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set in .env}"
    # No ports: only user-service reaches it, over this project's network as user-mysql:3306.
    volumes:
      - user_mysql_data:/var/lib/mysql
    healthcheck:
      # TCP ping: fails during first-run initialisation (temporary server without networking).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  user-service:
    build: .
    image: shopease-user-service:dev
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-ShopEase User Service}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_PREFIX: ${API_PREFIX:-/api}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopease_user_db}
      MYSQL_USER: "${MYSQL_USER:?set in .env}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set in .env}"
      # Container network address, not the MYSQL_HOST and MYSQL_PORT values in .env.
      MYSQL_HOST: user-mysql
      MYSQL_PORT: "3306"
      # Container address of the Authentication Service, not AUTH_SERVICE_VERIFY_URL from .env.
      AUTH_SERVICE_VERIFY_URL: ${DOCKER_AUTH_SERVICE_VERIFY_URL:-http://host.docker.internal:8001/api/auth/verify-token}
      AUTH_SERVICE_TIMEOUT_SECONDS: ${AUTH_SERVICE_TIMEOUT_SECONDS:-5}
    # Docker Desktop defines host.docker.internal already; this also makes it work on Linux.
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${USER_SERVICE_HOST_PORT:-8002}:8002"]
    # Starts only once MySQL answers its health check. The image's command then runs
    # "alembic upgrade head" and starts Uvicorn only if that succeeds, so no request is accepted
    # before the schema is current. A failed migration stops the container (and restart retries).
    depends_on:
      user-mysql:
        condition: service_healthy
        restart: true

volumes:
  user_mysql_data:
