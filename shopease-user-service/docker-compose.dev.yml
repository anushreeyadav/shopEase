# Development only: publishes MySQL on this machine (127.0.0.1, not the network), so that
# Alembic and pytest can run outside a container. Not needed to run the service in Docker.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  user-mysql:
    ports: ["127.0.0.1:${MYSQL_PORT:-3309}:3306"]
