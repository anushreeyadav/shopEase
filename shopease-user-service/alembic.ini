# Alembic configuration for the ShopEase User Service.
#
# There is deliberately no sqlalchemy.url here. alembic/env.py builds the URL from the
# MYSQL_* environment variables (or .env) through app.core.config, so no credentials are
# stored in this file, and env.py refuses to run against any database other than
# shopease_user_db.
#
# Run from the project root (the folder containing this file):
#   alembic revision --autogenerate -m "create user and address tables"
#   alembic upgrade head
#   alembic downgrade -1
#   alembic current            # revision applied to the database
#   alembic check              # fails if the models and the database differ

[alembic]
script_location = %(here)s/alembic
# Lets alembic/env.py import the app package when run from the project root.
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
