# Standalone stack for this service: the API and its own MySQL database.
# Values come from .env (see .env.example), which is never copied into the image.
#
# The Authentication Service runs in its own Compose project (shopease-auth-service), on its own
# Docker network. Nothing here assumes the two projects share a network:
#   - default: this container calls the port the Auth Service publishes on this machine, through
#     host.docker.internal:8001 (DOCKER_AUTH_SERVICE_VERIFY_URL in .env to change it);
#   - optional: join the Auth Service's network explicitly and call it by service name, with
#     docker-compose.auth-network.yml (see that file).
#
# MySQL is not published to the host. To reach it from this machine (Alembic, pytest or the
# seed script outside a container), add docker-compose.dev.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

name: shopease-product-catalog-service

services:
  catalog-mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set in .env}"
      # Fixed, not taken from the shell or .env: the stack always uses this service's database.
      MYSQL_DATABASE: shopease_product_catalog_db
      MYSQL_USER: "${MYSQL_USER:?set in .env}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set in .env}"
    # No ports: only catalog-service reaches it, as catalog-mysql:3306.
    volumes:
      - catalog_mysql_data:/var/lib/mysql
    # Healthy only when the service's own user can open the service's database over TCP. During
    # first-run initialisation MySQL runs a temporary server without networking, so this fails
    # until the database and user exist. The password is passed in the environment, not as an
    # argument, so it does not appear in the process list.
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -N -e 'SELECT 1' \"$$MYSQL_DATABASE\" > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  catalog-service:
    build: .
    image: shopease-product-catalog-service:dev
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-ShopEase Product Catalog Service}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_PREFIX: ${API_PREFIX:-/api}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      # Inside the container the service listens on all interfaces, on SERVICE_PORT.
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: ${SERVICE_PORT:-8006}
      MYSQL_DATABASE: shopease_product_catalog_db
      MYSQL_USER: "${MYSQL_USER:?set in .env}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set in .env}"
      # Container network address, not the MYSQL_HOST and MYSQL_PORT values in .env.
      MYSQL_HOST: catalog-mysql
      MYSQL_PORT: "3306"
      AUTH_SERVICE_VERIFY_URL: ${DOCKER_AUTH_SERVICE_VERIFY_URL:-http://host.docker.internal:8001/api/auth/verify-token}
      AUTH_SERVICE_TIMEOUT_SECONDS: ${AUTH_SERVICE_TIMEOUT_SECONDS:-5}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD:-5}
    # Docker Desktop defines host.docker.internal already; this also makes it work on Linux.
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Published on this machine only (127.0.0.1), on the same port number.
    ports: ["127.0.0.1:${SERVICE_PORT:-8006}:${SERVICE_PORT:-8006}"]
    # Starts once MySQL is healthy. The image then waits for the database itself, runs
    # "alembic upgrade head", and only then starts the server.
    depends_on:
      catalog-mysql:
        condition: service_healthy
        restart: true

volumes:
  catalog_mysql_data:
