# Development only: publishes MySQL on this machine (127.0.0.1, not the network), so that
# Alembic, pytest and scripts/seed_sample_data.py can run outside a container.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  catalog-mysql:
    ports: ["127.0.0.1:${MYSQL_PORT:-3310}:3306"]
