# Alembic configuration for the ShopEase Product Catalog Service.
#
# There is deliberately no sqlalchemy.url here. alembic/env.py builds the URL from the
# MYSQL_* environment variables (or .env) through app.core.config, so no credentials are
# stored in this file. env.py imports every model (app.models) for autogenerate, and refuses
# to run against any database other than shopease_product_catalog_db or the throwaway
# shopease_product_catalog_test_db.
#
# Run from the project root (the folder containing this file). See README.md, "Database migrations".
#   alembic current            # revision applied to the database
#   alembic upgrade head       # apply all migrations
#   alembic check              # fails if the models and the database differ
#   alembic revision --autogenerate -m "describe the change"    # after changing a model
#   alembic downgrade -1       # undo the last migration: drops data; test database only

# Generated migration files start with the date, so they sort in creation order.
# (The initial migration, 5b8e2f0c9d14, predates this setting.)

[alembic]
script_location = %(here)s/alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
# Lets alembic/env.py import the app package when run from the project root.
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
