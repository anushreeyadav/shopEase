# Alembic configuration for product_service (database: product_db).
# Run from the repository root so .env is found:
#     alembic -c services/product_service/alembic.ini upgrade head
# No database URL here: migrations/env.py builds it from PRODUCT_DB_MIGRATION_USER /
# PRODUCT_DB_MIGRATION_PASSWORD and MYSQL_HOST / MYSQL_PORT / PRODUCT_DB_NAME.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
